<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-Up Form — No Policy (Starter)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h1>Create your account</h1>
    <img class="logo" src="logo.svg" alt="app logo">

    <!-- TODO: this page has no Content-Security-Policy at all. Write one in
         headers.json that scopes every resource type this page actually uses
         (style-src, img-src, font-src), plus the hardening trio
         (object-src 'none', base-uri, form-action) — with zero violations
         and no 'unsafe-*' keywords. -->

    <form id="signup-form" action="/api/echo" method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <button type="submit">Sign up</button>
    </form>

    <p class="status" id="status"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
