spring.application.name=smc-05-safe-error-handling

# --- SOLUTION (GREEN) configuration ---
# The GlobalExceptionHandler (@RestControllerAdvice) intercepts every error path and
# returns a safe RFC 7807 ProblemDetail, so the default error-attribute includes below
# are defensively kept OFF. Even if they were on, the advice short-circuits the default
# error handling for these exceptions.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
