# ---- TEST configuration ----
# Test-only, synthetic AES-256 key (32 random bytes, base64). This is NOT a real
# secret and protects no real data — it exists purely so the crypto layer has a key
# during tests. Real deployments supply VITALLEDGER_AES_KEY from the environment.
# Property key is lowercase/dotted so it is clearly test config, not an exported secret.
vitalledger.aes.key=ciT4RD8Uk3GXdiRtYRBYsIoSgHFVQ5uDCrZVN3ZGGX4=

spring.datasource.url=jdbc:h2:mem:vitalledger-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
