spring.application.name=vitalledger

# ---- H2 in-memory datastore ----
spring.datasource.url=jdbc:h2:mem:vitalledger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 web console stays OFF (attack surface).
spring.h2.console.enabled=false

# ---- No-leak error responses: never surface internals to callers ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ---- Encryption key (AES for encryption at rest) ----
# Supplied ONLY from the environment. Left unset here on purpose so the app
# fails fast at startup if VITALLEDGER_AES_KEY is not provided.
# vitalledger.aes.key is relaxed-bound from the VITALLEDGER_AES_KEY env var.
vitalledger.aes.key=${VITALLEDGER_AES_KEY:}
