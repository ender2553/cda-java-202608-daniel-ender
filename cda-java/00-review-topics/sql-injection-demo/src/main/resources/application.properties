# Load DB_URL, DB_USERNAME, DB_PASSWORD from .env in the working directory.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Every connection works in the app schema, so SQL can say "products", not "app.products".
spring.datasource.hikari.schema=app

# Web app on http://localhost:8080 (static page at /, REST under /api).
# Bind to localhost ONLY, so nobody else on the network can reach the
# deliberately-vulnerable endpoints.
server.address=127.0.0.1
server.port=8080
spring.main.banner-mode=off

# Keep the console quiet; detail goes to the log file.
logging.file.name=logs/sqli-demo.log
logging.level.root=WARN
logging.level.demo.sqli=INFO
