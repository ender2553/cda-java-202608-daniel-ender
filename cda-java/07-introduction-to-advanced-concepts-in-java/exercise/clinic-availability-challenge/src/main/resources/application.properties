# Load DB_URL, DB_USERNAME and DB_PASSWORD from .env in the working directory
# (the project root when run from IntelliJ).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=clinic

# A small clinic runs on a small server: 5 database connections, 3-second wait.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=2000

spring.main.web-application-type=none
spring.main.banner-mode=off

# The console is for the menu only. Full error detail goes to logs/clinic.log.
logging.threshold.console=OFF
logging.file.name=logs/clinic.log
logging.level.root=WARN
logging.level.demo.clinic=INFO
logging.level.com.zaxxer.hikari.pool.ProxyLeakTask=WARN
