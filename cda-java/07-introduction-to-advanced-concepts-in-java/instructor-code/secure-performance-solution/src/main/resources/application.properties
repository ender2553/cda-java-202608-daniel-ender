# Load DB_URL, DB_USERNAME and DB_PASSWORD from .env in the working directory
# (the project root when run from IntelliJ).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Every connection works in the ledgercore schema, so SQL can say "accounts", not "ledgercore.accounts".
spring.datasource.hikari.schema=ledgercore

# A small connection pool, so a leak shows up after 5 calls instead of hundreds.
# Hikari hands out at most 5 connections; a caller waits up to 3 seconds for one,
# then fails. Any connection held longer than 2 seconds is logged as a possible leak.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=2000

# A console app: no web server, no banner.
spring.main.web-application-type=none
spring.main.banner-mode=off

# The console is for the menu only. Full error detail goes to logs/ledger-demo.log ("log rich, respond thin").
logging.threshold.console=OFF
logging.file.name=logs/ledger-demo.log
logging.level.root=WARN
logging.level.demo.ledger=INFO
logging.level.com.zaxxer.hikari.pool.ProxyLeakTask=WARN
