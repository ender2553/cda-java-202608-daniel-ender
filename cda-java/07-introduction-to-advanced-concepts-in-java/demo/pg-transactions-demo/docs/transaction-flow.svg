<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Transfer demo: application, connection, and database</title>
  <desc id="desc">Java objects in the application boundary connect through JDBC to three PostgreSQL tables. Three numbered solid lines trace the naive, atomic, and visibility scenarios. Lettered circles A to F mark the risk and failure points, explained in the key at the bottom.</desc>

  <defs>
    <marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <style>
      .boundary { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; }
      .boundary-label { font-size: 15px; font-weight: 700; fill: #334155; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .name { font-size: 15px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .sub { font-size: 12px; fill: #374151; text-anchor: middle; }
      .link { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .link-label { font-size: 11px; fill: #4b5563; }
      .s1 { fill: none; stroke: #c2410c; stroke-width: 3; marker-end: url(#arrow-1); }
      .s2 { fill: none; stroke: #1d4ed8; stroke-width: 3; marker-end: url(#arrow-2); }
      .s3 { fill: none; stroke: #15803d; stroke-width: 3; marker-end: url(#arrow-3); }
      .s1-plain { fill: none; stroke: #c2410c; stroke-width: 3; }
      .s2-plain { fill: none; stroke: #1d4ed8; stroke-width: 3; }
      .s3-plain { fill: none; stroke: #15803d; stroke-width: 3; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .risk { fill: #ffffff; stroke: #b91c1c; stroke-width: 2.5; }
      .risk-letter { font-size: 14px; font-weight: 700; fill: #b91c1c; text-anchor: middle; dominant-baseline: central; }
      .key { font-size: 13px; fill: #111827; }
      .key-head { font-size: 13px; font-weight: 700; fill: #111827; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="880" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="700" fill="#111827">One transfer: application, connection, and database</text>

  <!-- ============ boundaries ============ -->
  <rect class="boundary" x="20" y="60" width="560" height="520" rx="8"/>
  <text class="boundary-label" x="36" y="84">Application (JVM)</text>

  <rect class="boundary" x="780" y="60" width="400" height="460" rx="8"/>
  <text class="boundary-label" x="796" y="84">PostgreSQL (ledger_demo)</text>

  <rect class="boundary" x="780" y="560" width="400" height="130" rx="8"/>
  <text class="boundary-label" x="796" y="584">Second session (Terminal B)</text>

  <!-- ============ dotted connections (drawn first, under the flows) ============ -->
  <path class="link" d="M240,164 V280"/>                       <!-- TransferDemo - TransferService -->
  <path class="link" d="M170,360 V480"/>                       <!-- TransferService - Database -->
  <path class="link" d="M280,290 H440 V164"/>                  <!-- TransferService - TransferFailedException -->
  <path class="link" d="M250,360 V448 H330"/>                  <!-- TransferService - System.Logger -->
  <path class="link" d="M280,512 H685 V360"/>                  <!-- Database - JDBC -->
  <path class="link" d="M685,280 V100 H780"/>                  <!-- JDBC - PostgreSQL -->
  <path class="link" d="M1005,170 V230"/>                      <!-- transfers - accounts -->
  <text class="link-label" x="1012" y="204">FK</text>
  <path class="link" d="M1005,310 V370"/>                      <!-- accounts - ledger_entries -->
  <text class="link-label" x="1012" y="344">FK</text>
  <path class="link" d="M1005,600 V520"/>                      <!-- psql - PostgreSQL -->

  <!-- ============ objects ============ -->
  <rect class="box" x="60" y="100" width="220" height="64"/>
  <text class="name" x="170" y="126">TransferDemo</text>
  <text class="sub" x="170" y="147">runs scenarios, prints snapshots</text>

  <rect class="box" x="330" y="100" width="220" height="64"/>
  <text class="name" x="440" y="126">TransferFailedException</text>
  <text class="sub" x="440" y="147">safe message for the caller</text>

  <rect class="box" x="60" y="280" width="220" height="80"/>
  <text class="name" x="170" y="305">TransferService</text>
  <text class="sub" x="170" y="326">naiveTransfer(...)</text>
  <text class="sub" x="170" y="344">transfer(...)</text>

  <rect class="box" x="330" y="420" width="220" height="56"/>
  <text class="name" x="440" y="443">System.Logger</text>
  <text class="sub" x="440" y="463">internal log (stderr)</text>

  <rect class="box" x="60" y="480" width="220" height="64"/>
  <text class="name" x="170" y="506">Database</text>
  <text class="sub" x="170" y="527">connection settings, reset()</text>

  <rect class="box" x="610" y="280" width="150" height="80"/>
  <text class="name" x="685" y="305">JDBC</text>
  <text class="sub" x="685" y="326">pgjdbc driver</text>
  <text class="sub" x="685" y="344">auto-commit on / off</text>

  <rect class="box" x="860" y="100" width="290" height="70"/>
  <text class="name" x="1005" y="128">transfers</text>
  <text class="sub" x="1005" y="150">header row: from, to, amount</text>

  <rect class="box" x="860" y="230" width="290" height="80"/>
  <text class="name" x="1005" y="258">accounts</text>
  <text class="sub" x="1005" y="280">balance, CHECK (balance &gt;= 0)</text>
  <text class="sub" x="1005" y="297">debit and credit</text>

  <rect class="box" x="860" y="370" width="290" height="70"/>
  <text class="name" x="1005" y="398">ledger_entries</text>
  <text class="sub" x="1005" y="420">2 lines per transfer, summing to 0</text>

  <rect class="box" x="860" y="600" width="290" height="60"/>
  <text class="name" x="1005" y="624">psql</text>
  <text class="sub" x="1005" y="645">SELECT * FROM accounts</text>

  <!-- ============ scenario 1: naive (auto-commit on) ============ -->
  <path class="s1" d="M90,164 V278"/>
  <path class="s1" d="M280,300 H608"/>
  <path class="s1-plain" d="M760,300 H800"/>
  <path class="s1-plain" d="M800,125 V390"/>
  <path class="s1" d="M800,125 H858"/>
  <path class="s1" d="M800,255 H858"/>
  <path class="s1" d="M800,390 H858"/>

  <!-- ============ scenario 2: atomic (one transaction) ============ -->
  <path class="s2" d="M120,164 V278"/>
  <path class="s2" d="M280,320 H608"/>
  <path class="s2-plain" d="M760,320 H815"/>
  <path class="s2-plain" d="M815,145 V415"/>
  <path class="s2" d="M815,145 H858"/>
  <path class="s2" d="M815,280 H858"/>
  <path class="s2" d="M815,415 H858"/>
  <path class="s2" d="M270,280 V240 H400 V166"/>               <!-- failure reported upward -->
  <path class="s2" d="M330,132 H282"/>                         <!-- caller receives the safe message -->
  <path class="s2" d="M275,360 V460 H328"/>                    <!-- detail logged internally -->

  <!-- ============ scenario 3: visibility (second session) ============ -->
  <path class="s3" d="M150,164 V278"/>
  <path class="s3" d="M280,340 H608"/>
  <path class="s3" d="M760,340 H830 V300 H858"/>
  <path class="s3" d="M1150,630 H1170 V275 H1152"/>

  <!-- ============ scenario numbers ============ -->
  <circle cx="90" cy="215" r="11" fill="#c2410c"/><text class="num" x="90" y="215">1</text>
  <circle cx="120" cy="215" r="11" fill="#1d4ed8"/><text class="num" x="120" y="215">2</text>
  <circle cx="150" cy="215" r="11" fill="#15803d"/><text class="num" x="150" y="215">3</text>
  <circle cx="400" cy="300" r="11" fill="#c2410c"/><text class="num" x="400" y="300">1</text>
  <circle cx="470" cy="320" r="11" fill="#1d4ed8"/><text class="num" x="470" y="320">2</text>
  <circle cx="540" cy="340" r="11" fill="#15803d"/><text class="num" x="540" y="340">3</text>
  <circle cx="335" cy="240" r="11" fill="#1d4ed8"/><text class="num" x="335" y="240">2</text>
  <circle cx="1170" cy="470" r="11" fill="#15803d"/><text class="num" x="1170" y="470">3</text>

  <!-- ============ risk / failure points ============ -->
  <circle class="risk" cx="60" cy="330" r="12"/><text class="risk-letter" x="60" y="330">A</text>
  <circle class="risk" cx="800" cy="195" r="12"/><text class="risk-letter" x="800" y="195">B</text>
  <circle class="risk" cx="842" cy="280" r="12"/><text class="risk-letter" x="842" y="280">C</text>
  <circle class="risk" cx="585" cy="320" r="12"/><text class="risk-letter" x="585" y="320">D</text>
  <circle class="risk" cx="306" cy="132" r="12"/><text class="risk-letter" x="306" y="132">E</text>
  <circle class="risk" cx="1170" cy="380" r="12"/><text class="risk-letter" x="1170" y="380">F</text>

  <!-- ============ key ============ -->
  <line x1="20" y1="706" x2="1180" y2="706" stroke="#cbd5e1" stroke-width="1"/>

  <path class="link" d="M30,730 H80"/><text class="key" x="90" y="735">connection or relationship</text>
  <path d="M300,730 H350" style="fill:none;stroke:#374151;stroke-width:3"/><text class="key" x="360" y="735">scenario flow (numbered)</text>
  <circle class="risk" cx="572" cy="730" r="10"/><text class="risk-letter" x="572" y="730" font-size="12">A</text><text class="key" x="590" y="735">risk or failure point</text>

  <circle cx="40" cy="762" r="10" fill="#c2410c"/><text class="num" x="40" y="762" font-size="12">1</text>
  <text class="key" x="58" y="767"><tspan class="key-head">naive:</tspan> auto-commit on, each write commits alone</text>
  <circle cx="440" cy="762" r="10" fill="#1d4ed8"/><text class="num" x="440" y="762" font-size="12">2</text>
  <text class="key" x="458" y="767"><tspan class="key-head">atomic:</tspan> one transaction, rollback on any failure</text>
  <circle cx="850" cy="762" r="10" fill="#15803d"/><text class="num" x="850" y="762" font-size="12">3</text>
  <text class="key" x="868" y="767"><tspan class="key-head">visibility:</tspan> psql reads mid-transfer</text>

  <text class="key" x="30" y="800"><tspan class="key-head">A</tspan>  Crash between the debit and the credit (the afterDebit checkpoint)</text>
  <text class="key" x="30" y="824"><tspan class="key-head">B</tspan>  Auto-commit: each write commits alone, so the half-done transfer stays</text>
  <text class="key" x="30" y="848"><tspan class="key-head">C</tspan>  CHECK constraint rejects the overdraft after the header row was written</text>
  <text class="key" x="620" y="800"><tspan class="key-head">D</tspan>  Rollback must run on every failure, before setAutoCommit(true)</text>
  <text class="key" x="620" y="824"><tspan class="key-head">E</tspan>  Raw SQLException detail leaking to the caller</text>
  <text class="key" x="620" y="848"><tspan class="key-head">F</tspan>  Another session sees the naive debit, but not the atomic one</text>
</svg>
