spring.application.name=rpg-adventure
spring.profiles.active=${RPG_PROFILE:memory}
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN
spring.datasource.url=${RPG_DB_URL:jdbc:postgresql://localhost:5432/rpg_adventure}
spring.datasource.username=${RPG_DB_USER:rpg_app}
spring.datasource.password=${RPG_DB_PASSWORD:change-me}
rpg.file.path=${RPG_FILE_PATH:${user.home}/.rpg-adventure/save.json}


