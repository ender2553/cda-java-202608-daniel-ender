<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initialscale=1" />
        <style>
            .stats {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px));
                gap: 1rem;
            }

            .stat {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
        </style>
    </head>
    <body>
        <div class="stats">
            <div class="stat"><span>👥 </span><p>128 learners</p></div>
            <div class="stat"><span>📈 </span><p>94% completion</p></div>
            <div class="stat"><span>⏱</span><p>2.1h avg pace</p></div>
            <div class="stat"><span>✅ </span><p>17 courses live</p></div>
        </div>
    </body>
</html>
