<!DOCTYPE html>
<html>
    <head>
        <style>
            .actions {
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
            }

            .actions > button {
                flex: 1;
            }
            
            .actions > .cancel {
                flex: 0 0 120px;
            }
           
        </style>
    </head>
    <body>
        <div class="actions">
            <button>Save</button>
            <button>Preview</button>
            <button class="cancel">Cancel</button>
        </div>
    </body>
</html>
