<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony's Music Playlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <!-- Header Section -->
        <header class="header box">
            <h1>Anthony's Music Playlist</h1>
        </header>

        <!-- Sidebar Section -->
        <aside class="sidebar box">
            <h2>Genres</h2>
            <ul>
                <li>Metal</li>
                <li>Rap</li>
                <li>Punk</li>
                <li>Alt</li>
                <li>Jazz</li>
                <li>Blues</li>
                <li>Random</li>
            </ul>
        </aside>

        <!-- Main Content Section -->
        <main class="main">
            <h2 class="main-title">Punk Bands</h2>
            <div class="band-card box">The Descendents</div>
            <div class="band-card box">The MIsfists</div>
            <div class="band-card box">Operation Ivy</div>
        </main>

        <!-- Footer Section -->
        <footer class="footer box">
            <p>Music Playlists INC 2026</p>
        </footer>
    </div>
</body>
</html>
