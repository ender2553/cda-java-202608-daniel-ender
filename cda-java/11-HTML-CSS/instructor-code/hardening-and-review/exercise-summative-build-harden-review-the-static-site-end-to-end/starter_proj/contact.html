<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Send Riverside Books a note about an order or an event.">
  <title>Riverside Books — Contact</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="brand">
      <img src="images/logo.svg" alt="Riverside Books logo">
      <span class="brand-name">Riverside Books</span>
    </div>
    <nav aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main id="main">
    <section>
      <h1>Contact us</h1>
      <p>Questions about an order or an upcoming event? Send a note and we will reply
      within two business days.</p>

      <form action="https://example.com/contact" method="post">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required minlength="2" maxlength="80" autocomplete="name">
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>

        <div>
          <label for="topic">Topic</label>
          <input id="topic" name="topic" type="text" maxlength="120" pattern="[A-Za-z0-9 ,.\-]+">
          <span class="field-hint">Letters, numbers, spaces, commas, periods, and hyphens only.</span>
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required minlength="10" maxlength="1000"></textarea>
        </div>

        <button type="submit">Send message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>Riverside Books &mdash; 14 Waterway Lane</p>
  </footer>
</body>
</html>
