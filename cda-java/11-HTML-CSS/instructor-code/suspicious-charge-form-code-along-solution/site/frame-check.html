<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frame Check</title>
    <link rel="icon" href="logo.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>Frame Check</h1>
      <p>This is a separate page that embeds <code>report.html</code> in an <code>&lt;iframe&gt;</code>.
         Nothing in the form's own markup can stop another page from doing this.</p>
      <iframe src="report.html" title="Embedded copy of the report form" width="100%" height="520"></iframe>
    </main>
  </body>
</html>
