# PostgreSQL database xss_demo, user postgres.
# Set DB_PASSWORD in the environment if your postgres password is not "postgres".
spring.datasource.url=jdbc:postgresql://localhost:5432/xss_demo
spring.datasource.username=postgres
spring.datasource.password=admin

# Schema is set up with psql or the Reset button, never by Spring on startup,
# so restarting the app keeps students' payloads.
spring.sql.init.mode=never

# Bind to localhost ONLY, so nobody else on the network can reach the
# deliberately-vulnerable endpoints.
server.address=127.0.0.1
server.port=8080
spring.main.banner-mode=off
